<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password reminder — ForexBid</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-setup.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header" data-active="login"></div>
  <main class="auth-wrap">
    <form class="auth-card" data-next="password-change.html">
      <p class="section-kicker">Account recovery</p>
      <h1>Password reminder</h1>
      <p class="lede">Submit your registered email. In this demo the next screen is the new-password form — no email is sent.</p>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required placeholder="you@email.com">
      <button class="btn btn-brand" type="submit">Send reminder</button>
      <p class="auth-extra"><a href="login.html">Back to sign in</a></p>
    </form>
  </main>
  <div id="site-footer"></div>
  <script src="js/app.js"></script>
  <script src="js/forms.js"></script>
</body>
</html>
