<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set a new password — ForexBid</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-setup.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header" data-active="login"></div>
  <main class="auth-wrap">
    <form class="auth-card" id="password-change-form" data-next="dashboard.html">
      <p class="section-kicker">Account recovery</p>
      <h1>Set a new password</h1>
      <p class="lede">Enter and confirm a new password, then continue into the demo dashboard.</p>
      <label for="password">New password</label>
      <input id="password" name="password" type="password" required placeholder="New password">
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" required placeholder="Confirm password">
      <p class="form-note" id="match-error">Passwords do not match.</p>
      <button class="btn btn-brand" type="submit">Save password</button>
      <p class="auth-extra"><a href="login.html">Back to sign in</a></p>
    </form>
  </main>
  <div id="site-footer"></div>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("password-change-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var pass = document.getElementById("password").value;
      var confirm = document.getElementById("confirm").value;
      var note = document.getElementById("match-error");
      if (pass !== confirm) {
        note.classList.add("show");
        return;
      }
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
