<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — ForexBid</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-setup.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header" data-active="login"></div>
  <main class="auth-wrap">
    <form class="auth-card" data-next="dashboard.html">
      <p class="section-kicker">Secure access</p>
      <h1>Sign in</h1>
      <p class="lede">Enter any email and password. This demo does not check a real account.</p>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required placeholder="you@email.com">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required placeholder="Password">
      <button class="btn btn-brand" type="submit">Sign In</button>
      <p class="auth-extra"><a href="password-reminder.html">Forgot password?</a></p>
    </form>
  </main>
  <div id="site-footer"></div>
  <script src="js/app.js"></script>
  <script src="js/forms.js"></script>
</body>
</html>
