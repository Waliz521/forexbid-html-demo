<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — ForexBid</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-setup.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app-shell" class="app-shell" data-active="dashboard" data-title="Notifications" data-lede="Stay updated with ForexBid account, trading activity, and system notices.">
    <div class="app-main">
      <div class="app-body">
        <div class="notif-toolbar">
          <div class="notif-pills" id="notif-pills"></div>
          <button class="notif-mark" type="button" id="notif-mark">Mark all as read</button>
        </div>
        <div class="notif-card" id="notif-list"></div>
      </div>
    </div>
  </div>
  <script src="js/app-shell.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
