<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deal flow — ForexBid</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-setup.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="container app-header-inner">
      <a class="logo" href="index.html">
        <img src="assets/logo-light.jpg" alt="ForexBID">
      </a>
      <nav class="app-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">My profile</a>
        <div class="app-user">Joe Bloggs <a href="index.html">Sign out</a></div>
      </nav>
    </div>
  </header>
  <main class="app-page">
    <div class="container">
      <h1 style="font-family:var(--display);margin-top:0">Deal flow</h1>
      <p class="lede">This page allows you to manage a Forex deal between you and another party.</p>
      <div class="app-card">
        <p id="deal-summary" class="lede">You accepted a mock bid from checkout. Activity, Messages, Funding and Reviews tabs come in Milestone 2.</p>
        <div class="step-actions">
          <a class="btn btn-teal" href="dashboard.html">Go to dashboard</a>
          <a class="btn btn-ghost" href="index.html#get-fx">Back to Get FX</a>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/app.js"></script>
  <script>
    try {
      var bid = JSON.parse(sessionStorage.getItem("fxb-selected-bid") || "null");
      if (bid) {
        document.getElementById("deal-summary").textContent =
          "Locked demo deal with " + bid.partner + ": " + bid.amount + " " + bid.from + " → " + bid.to +
          " at " + Number(bid.rate).toLocaleString() + ". Full deal-room tabs are Milestone 2.";
      }
    } catch (e) {}
  </script>
</body>
</html>
